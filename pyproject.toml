[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebase-knowledge-graph-mcp"
version = "0.1.0"
description = "MCP Server for Codebase Knowledge Graph Visualization"
authors = [
    { name = "mhmalvi", email = "info@aethonautomation.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "mcp>=1.0.0",
    "langchain>=0.1.0",
    "langchain-experimental>=0.0.45",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.0",
    "pyvis>=0.3.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[project.scripts]
codebase-kg-mcp = "mcp_server:main"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true