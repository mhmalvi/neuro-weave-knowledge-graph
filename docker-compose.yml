version: '3.8'

services:
  neuroweave-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroweave-knowledge-graph
    ports:
      - "8501:8501"  # Streamlit default port
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      # Mount volume for persistent visualizations
      - visualizations:/app/static/visualizations
      # Mount volume for temporary repos (optional persistence)
      - temp_repos:/app/temp_repos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - neuroweave-network

  # Optional: Add a reverse proxy for custom domain
  nginx:
    image: nginx:alpine
    container_name: neuroweave-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For HTTPS certificates
    depends_on:
      - neuroweave-app
    restart: unless-stopped
    networks:
      - neuroweave-network
    profiles:
      - production  # Only run with --profile production

volumes:
  visualizations:
    driver: local
  temp_repos:
    driver: local

networks:
  neuroweave-network:
    driver: bridge